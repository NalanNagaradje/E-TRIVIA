services:
  database:
    image: mysql:8.0
    container_name: etrivia_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: etrivia_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - etrivia-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./backend-api
    container_name: etrivia_api
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: etrivia_db
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin1234
      # Code du restaurant CROUS par défaut 
      CROUS_RESTAURANT_CODE: ""
    ports:
      - "5050:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - etrivia-network
    volumes:
      - ./backend-api:/app

  web:
    build: ./frontend-php
    container_name: etrivia_web
    restart: always
    ports:
      - "8080:80"
    environment:
      API_URL: http://api:5000
    depends_on:
      - api
    networks:
      - etrivia-network
    volumes:
      - ./frontend-php:/var/www/html

volumes:
  db_data:

networks:
  etrivia-network:
    driver: bridge
